<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>武则天带你游洛阳 · 重设计 v1</title>
<style>
/* ================= 设计系统（落地 → app.wxss :root） ================= */
:root{
  --ink-0:#0A1A1D; --ink-1:#12262B; --ink-2:#1A343A; --ink-3:#214147;
  --gold-100:#F4E6CA; --gold-300:#E0C48F; --gold-500:#C6A46B;
  --line-1:rgba(198,164,107,.16); --line-2:rgba(198,164,107,.30);
  --text-hi:#F0E6D4; --text-mid:#B7C3BB; --text-low:#8A9B95;
  --peony-500:#B4708A; --peony-surface:#33252E; --alert:#EBA9AF;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --f-d1:28px; --f-d2:22px; --f-title:18px; --f-section:15px; --f-body:14px; --f-caption:12px; --f-kicker:11px;
  --ease:cubic-bezier(.22,.7,.32,1); --t-1:160ms; --t-2:240ms; --t-3:420ms; --t-4:1200ms;
  --hl:inset 0 1px 0 rgba(244,230,202,.07); --lift:0 12px 30px rgba(0,0,0,.45);
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --petal-n:6;
}
/* 高对比档：验证「金字提亮」在真机上的可接受度 */
:root.contrast{--text-mid:#D2DCD5; --text-low:#A9B7B0; --line-1:rgba(198,164,107,.26); --line-2:rgba(224,196,143,.46)}
/* 动效关闭档 */
:root.no-motion *{animation-duration:1ms !important;transition-duration:1ms !important}

*{box-sizing:border-box;margin:0;padding:0}
body{background:#061114;color:var(--text-hi);font-family:var(--sans);
  min-height:100vh;display:grid;grid-template-columns:220px 1fr;gap:var(--s-6);padding:var(--s-5) var(--s-6) 120px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-300);outline-offset:2px;border-radius:var(--r-sm)}

/* ================= 画布外壳（非设计系统） ================= */
.rail{position:sticky;top:var(--s-5);align-self:start}
.rail h1{font-family:var(--serif);font-size:19px;color:var(--gold-100);font-weight:600;line-height:1.35}
.rail .sub{font-size:11px;color:var(--text-low);margin:6px 0 var(--s-5);letter-spacing:1px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);
  font-size:12px;color:var(--text-mid);text-align:left;transition:background var(--t-1),color var(--t-1)}
.rail nav button:hover{background:var(--ink-1);color:var(--text-hi)}
.rail nav button[aria-current="true"]{background:var(--ink-2);color:var(--gold-100);box-shadow:var(--hl)}
.rail nav button i{font-style:normal;font-family:var(--serif);font-size:11px;color:var(--gold-500);width:16px}
.rail .reset{margin-top:var(--s-4);font-size:11px;color:var(--text-low);text-decoration:underline;text-underline-offset:3px}
.stage{display:flex;justify-content:center;align-items:flex-start}

/* ================= 设备 ================= */
.phone{position:relative;width:390px;height:844px;background:var(--ink-0);border:1px solid var(--line-1);
  border-radius:34px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--lift)}
.status{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:11px;color:var(--text-low);letter-spacing:1px}
.navbar{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;
  background:var(--ink-0);border-bottom:1px solid var(--line-1);position:relative}
.navbar .nback{position:absolute;left:14px;font-size:13px;color:var(--gold-300)}
.viewport{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 var(--s-4) var(--s-5);scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.watermark{position:absolute;pointer-events:none;opacity:.20}
/* palace 线描素材自带深底，用 lighten 把底色提掉，只留鎏金线条 */
img[src*="palace"]:not(.hero){mix-blend-mode:lighten}
.goldstream{position:absolute;top:-18%;bottom:-18%;left:-52%;width:38%;z-index:20;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(224,196,143,.13) 30%,rgba(244,230,202,.42),transparent);
  filter:blur(11px);transform:skewX(-20deg);animation:gold 690ms var(--ease) both}
@keyframes gold{from{left:-52%}to{left:128%}}

/* ================= 原子件 ================= */
.kicker{font-size:var(--f-kicker);letter-spacing:4px;color:var(--gold-500);line-height:1.4}
.display{font-family:var(--serif);font-size:var(--f-d1);font-weight:600;color:var(--gold-100);line-height:1.2}
.title{font-family:var(--serif);font-size:var(--f-title);font-weight:600;color:var(--gold-100);line-height:1.25}
.section{font-size:var(--f-section);font-weight:600;color:var(--text-hi)}
.body{font-size:var(--f-body);line-height:1.7;color:var(--text-hi);text-wrap:pretty}
.muted{font-size:var(--f-caption);line-height:1.7;color:var(--text-mid);text-wrap:pretty}
.faint{font-size:11px;line-height:1.6;color:var(--text-low)}
.rule{height:1px;background:var(--line-1);margin:var(--s-4) 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2)}
.card{background:var(--ink-2);border:1px solid var(--line-1);border-radius:var(--r-md);padding:var(--s-4);
  box-shadow:var(--hl);margin-top:var(--s-3)}
.card.raised{background:var(--ink-3)}
.card.featured{border-color:var(--line-2);background:linear-gradient(158deg,var(--ink-3),var(--ink-2) 64%)}
.card.enter{animation:rise var(--t-3) var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.card.turn-out{animation:sink var(--t-2) ease both}
@keyframes sink{to{opacity:0;transform:translateY(-10px)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 var(--s-4);
  border-radius:var(--r-sm);font-size:var(--f-body);border:1px solid transparent;white-space:nowrap;
  transition:transform var(--t-1) var(--ease),filter var(--t-1) var(--ease),background var(--t-2)}
.btn.sm{height:36px;padding:0 var(--s-3);font-size:var(--f-caption)}
.btn.block{width:100%}
.btn.primary{background:linear-gradient(112deg,var(--gold-100),var(--gold-500));color:#0F2226;font-weight:600}
.btn.ghost{background:var(--ink-3);color:var(--gold-100);border-color:var(--line-2)}
.btn.text{background:none;border:0;color:var(--gold-300);height:auto;padding:2px 0;font-size:var(--f-caption)}
.btn:active:not(:disabled){transform:scale(.98);filter:brightness(1.07)}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:disabled{background:var(--ink-2);color:var(--text-low);border-color:var(--line-1);cursor:not-allowed;font-weight:400}
.btn.loading{position:relative;color:transparent !important;pointer-events:none}
.btn.loading:after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;
  border:2px solid rgba(15,34,38,.35);border-top-color:#0F2226;animation:spin 720ms linear infinite}
.btn.ghost.loading:after,.btn.text.loading:after{border-color:rgba(224,196,143,.3);border-top-color:var(--gold-300)}
@keyframes spin{to{transform:rotate(360deg)}}

.choice{display:flex;align-items:center;gap:var(--s-2);min-height:46px;padding:10px var(--s-3);border-radius:var(--r-sm);
  background:var(--ink-1);border:1px solid var(--line-1);color:var(--text-hi);font-size:var(--f-caption);line-height:1.5;
  text-align:left;width:100%;transition:background var(--t-2) var(--ease),border-color var(--t-2),transform var(--t-1)}
.choice:hover{border-color:var(--line-2)}
.choice:active{transform:scale(.985)}
.choice[aria-pressed="true"]{background:var(--ink-3);border-color:var(--gold-500);color:var(--gold-100)}
.badge{flex:0 0 22px;height:22px;display:grid;place-items:center;border-radius:50%;font-size:11px;
  border:1px solid var(--line-2);color:var(--gold-300);transition:background var(--t-2),color var(--t-2)}
.choice[aria-pressed="true"] .badge{background:var(--gold-500);border-color:var(--gold-500);color:#0F2226}
.badge.pop{animation:pop var(--t-3) var(--ease)}
@keyframes pop{40%{transform:scale(1.28)}100%{transform:scale(1)}}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:1px;color:var(--text-mid);
  border:1px solid var(--line-1);border-radius:999px;padding:3px 9px}
.chip.alert{color:var(--alert);border-color:rgba(235,169,175,.32)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gold-300);flex:0 0 5px}
.dot.live{animation:pulse 1.6s var(--ease) infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}

.step-rail{display:flex;align-items:center;gap:6px;padding:var(--s-3) 0 var(--s-2)}
.st{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:1px;color:var(--text-low)}
.st b{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-weight:400;font-size:9px;
  border:1px solid var(--line-1);transition:background var(--t-2),color var(--t-2),border-color var(--t-2)}
.st.done b{border-color:var(--gold-500);color:var(--gold-300)}
.st.now{color:var(--gold-100)}
.st.now b{background:var(--gold-500);border-color:var(--gold-500);color:#0F2226}
.st .lb{white-space:nowrap}
.bar{flex:1;height:1px;background:var(--line-1);min-width:12px}
:root.hide-rail .step-rail{display:none}

.list-row{display:flex;align-items:center;gap:var(--s-3);padding:10px var(--s-1);border-bottom:1px solid var(--line-1);
  font-size:var(--f-caption);width:100%;text-align:left;color:var(--text-hi)}
.list-row:last-of-type{border-bottom:0}
.list-row .num{flex:0 0 18px;color:var(--gold-500);font-family:var(--serif)}
.list-row .tag-now{margin-left:auto;color:var(--gold-500);font-size:11px}
.list-row .tag-done{margin-left:auto;color:var(--text-low);font-size:11px}
.list-row:active{background:var(--ink-1)}
.list-row.on{color:var(--gold-100);border-left:2px solid var(--gold-500);padding-left:10px}

/* ================= 01 intro ================= */
.opening{flex:1;min-height:0;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 70% 64%,var(--ink-2),var(--ink-0) 68%)}
.mist{position:absolute;width:105%;height:22%;border-radius:50%;filter:blur(34px);
  background:rgba(198,164,107,.07);animation:drift 9s ease-in-out infinite alternate}
.mist-a{left:-22%;top:24%} .mist-b{right:-20%;bottom:16%;animation-delay:-2.4s}
@keyframes drift{from{transform:translateX(-8%) scale(.92)}to{transform:translateX(16%) scale(1.12)}}
.inscription{position:absolute;top:11%;left:9%;z-index:4;animation:fadeUp var(--t-3) 200ms var(--ease) both}
.buildings{position:absolute;top:24%;left:6%;width:48%;height:56%;z-index:3;display:flex;flex-direction:column;
  justify-content:space-between}
.buildings img{width:100%;height:19%;object-fit:contain;opacity:0;animation:fadeUp var(--t-4) var(--ease) both}
.empress-full{position:absolute;bottom:11%;right:-4%;width:56%;height:64%;z-index:3;
  animation:fadeUp var(--t-4) 360ms var(--ease) both}
.empress-full img{width:100%;height:100%;object-fit:contain}
.petal{position:absolute;top:-4%;width:8px;height:12px;border-radius:80% 15% 65% 22%;background:var(--peony-500);
  opacity:.4;animation:fall 9s linear infinite}
@keyframes fall{to{transform:translate(38px,108vh) rotate(160deg)}}
.invite{position:absolute;bottom:8.5%;left:0;right:0;text-align:center;z-index:4;font-family:var(--serif);
  font-size:17px;letter-spacing:3px;color:var(--gold-100);animation:fadeUp var(--t-3) 2270ms var(--ease) both}
.skip{position:absolute;bottom:3%;right:var(--s-4);z-index:5;font-size:11px;color:var(--text-low);
  border:1px solid var(--line-1);border-radius:999px;padding:5px 12px;transition:color var(--t-1),border-color var(--t-1)}
.skip:hover{color:var(--gold-300);border-color:var(--line-2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ================= 02/03 choose ================= */
.welcome{display:flex;align-items:center;gap:var(--s-3);min-height:126px;padding-top:var(--s-3);position:relative;z-index:2}
.welcome img{width:92px;height:146px;object-fit:contain;flex:0 0 92px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2)}
.dur{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px}
.route{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:var(--s-3);min-height:26px}
.route .node{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--gold-100);
  border:1px solid var(--line-2);border-radius:999px;padding:3px 8px;background:var(--ink-1);animation:rise var(--t-2) var(--ease) both}
.route .node i{font-style:normal;color:var(--gold-500);font-family:var(--serif)}
.route .arrow{color:var(--text-low);font-size:10px}
:root.hide-route .route{display:none}
.sticky{position:absolute;left:var(--s-4);right:var(--s-4);bottom:calc(var(--s-4) + 20px);z-index:6}
.counter b{font-family:var(--serif);font-size:15px;color:var(--gold-100)}

/* ================= 04 dialogue ================= */
.top{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4) 0}
.top .grow{flex:1;min-width:0}
.narrator{position:relative;display:flex;align-items:center;gap:var(--s-3);background:var(--ink-1);
  border:1px solid var(--line-1);border-radius:var(--r-md);padding:10px var(--s-3);overflow:hidden;box-shadow:var(--hl)}
.narrator .p{width:74px;height:100px;object-fit:contain;position:relative;z-index:2;flex:0 0 74px}
.narrator .v{flex:1;position:relative;z-index:2;min-width:0}
.narrator .ink{position:absolute;left:0;top:0;width:72%;height:100%;opacity:.07;pointer-events:none}
.meter{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:10px;color:var(--text-low)}
.meter .track{flex:1;height:2px;background:var(--line-1);border-radius:2px;overflow:hidden}
.meter .fill{height:100%;background:var(--gold-500);width:0;transition:width 200ms linear}
.mouth{display:flex;gap:2px;align-items:flex-end;height:10px}
.mouth u{width:2px;background:var(--gold-500);border-radius:1px;height:3px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:var(--s-3) var(--s-4);scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.msg{max-width:80%;margin-bottom:var(--s-3);animation:rise var(--t-3) var(--ease) both}
.msg .who{font-size:10px;letter-spacing:2px;color:var(--gold-500);margin-bottom:4px}
.msg .bubble{display:block;font-size:var(--f-body);line-height:1.7;padding:10px var(--s-3);text-align:left;
  border-radius:3px 10px 10px 10px;background:var(--ink-2);border:1px solid var(--line-1);box-shadow:var(--hl)}
.msg.me{margin-left:auto;text-align:right}
.msg.me .who{color:var(--peony-500);letter-spacing:0}
.msg.me .bubble{background:var(--peony-surface);border-color:rgba(180,112,138,.28);color:#F2E3E5}
.thinking{display:flex;align-items:center;gap:7px;font-size:var(--f-caption);color:var(--text-low);margin-bottom:var(--s-3)}
.thinking u{width:5px;height:5px;border-radius:50%;background:var(--gold-500);animation:bob 1.1s var(--ease) infinite}
.thinking u:nth-child(2){animation-delay:.15s} .thinking u:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-4px);opacity:.5}}
.controls{flex:0 0 auto;background:var(--ink-1);border-top:1px solid var(--line-2);padding:10px var(--s-4) var(--s-3)}
.controls .acts{display:flex;gap:7px}
.composer{display:flex;gap:var(--s-2);margin-top:10px}
.field{flex:1;min-width:0;height:44px;display:flex;align-items:center;padding:0 var(--s-3);border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:var(--ink-0)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text-hi);font:inherit;font-size:var(--f-body)}
.field input::placeholder{color:var(--text-low)}
.field:focus-within{border-color:var(--gold-500);box-shadow:0 0 0 3px rgba(198,164,107,.14)}
.field.fail{border-color:rgba(235,169,175,.5)}
.errline{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--alert);margin-top:7px}

/* ================= 05 map ================= */
.mapbox{position:relative;height:40vh;min-height:210px;border:1px solid var(--line-2);border-radius:var(--r-md);
  background:radial-gradient(ellipse at 40% 30%,var(--ink-2),var(--ink-0) 78%);overflow:hidden;margin-top:var(--s-3)}
.mapbox .grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--line-1) 1px,transparent 1px),linear-gradient(90deg,var(--line-1) 1px,transparent 1px);
  background-size:44px 44px}
.mk{position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);display:grid;place-items:center;
  border-radius:50%;border:1px solid var(--gold-500);background:var(--ink-1);color:var(--gold-100);
  font-size:11px;font-family:var(--serif);transition:transform var(--t-2) var(--ease),background var(--t-2)}
.mk:hover{transform:translate(-50%,-50%) scale(1.12)}
.mk.on{background:var(--gold-500);color:#0F2226}
.me-dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#7FB7A8;
  box-shadow:0 0 0 5px rgba(127,183,168,.2);transform:translate(-50%,-50%);animation:pulse 2s var(--ease) infinite}
.panel{position:absolute;left:var(--s-4);right:var(--s-4);bottom:var(--s-4);z-index:6;
  animation:rise var(--t-3) var(--ease) both}
.scrim{position:absolute;left:0;right:0;bottom:0;height:214px;z-index:5;pointer-events:none;
  background:linear-gradient(transparent 52%,var(--ink-0) 84%)}

/* ================= 06 story ================= */
.hero{width:100%;height:126px;object-fit:cover;border-radius:var(--r-md);display:block;margin:var(--s-3) 0}
.src{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-low);margin-top:10px}
.src a{color:var(--gold-300);text-decoration:none;border-bottom:1px solid var(--line-2)}

/* ================= 07 组件规范 ================= */
.spec{background:var(--ink-1);border:1px solid var(--line-1);border-radius:var(--r-md);padding:var(--s-4);
  box-shadow:var(--hl);margin-top:var(--s-3)}
.spec>b{display:block;font-size:10px;letter-spacing:2px;color:var(--text-low);font-weight:500;margin-bottom:var(--s-3)}
.spec .grid{display:flex;gap:var(--s-3);align-items:flex-start;flex-wrap:wrap}
figure{background:var(--ink-0);border:1px solid var(--line-1);border-radius:var(--r-sm);padding:6px;text-align:center;width:96px}
figure img{width:84px;height:112px;object-fit:contain}
figure img.crop{object-fit:cover;object-position:50% 16%}
figure figcaption{font-size:10px;color:var(--text-low);margin-top:4px}

/* ================= Tweaks ================= */
.tweaks{position:fixed;right:20px;bottom:20px;z-index:50;font-size:12px}
.tweaks .tbtn{background:var(--gold-100);color:#0F2226;font-weight:600;border-radius:999px;padding:9px 16px;
  box-shadow:var(--lift);transition:transform var(--t-1) var(--ease)}
.tweaks .tbtn:active{transform:scale(.97)}
.tweaks .panel{display:none;position:absolute;right:0;bottom:48px;width:262px;background:var(--ink-1);
  border:1px solid var(--line-2);border-radius:var(--r-md);padding:var(--s-4);box-shadow:var(--lift)}
.tweaks.open .panel{display:block;animation:rise var(--t-2) var(--ease) both}
.tweaks h3{font-family:var(--serif);font-size:14px;color:var(--gold-100);margin-bottom:var(--s-3)}
.tweaks label{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;color:var(--text-mid)}
.tweaks label span{flex:1}
.tweaks select,.tweaks input[type=range]{background:var(--ink-0);color:var(--text-hi);border:1px solid var(--line-1);
  border-radius:var(--r-sm);padding:3px 6px;font-size:11px;max-width:104px}
.switch{width:34px;height:19px;border-radius:999px;background:var(--ink-3);border:1px solid var(--line-1);position:relative;flex:0 0 34px}
.switch:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--text-low);
  transition:transform var(--t-2) var(--ease),background var(--t-2)}
.switch[aria-checked="true"]{background:var(--gold-500);border-color:var(--gold-500)}
.switch[aria-checked="true"]:after{transform:translateX(15px);background:#0F2226}
</style>
</head>
<body>

<div class="rail">
  <h1>武则天带你游洛阳</h1>
  <div class="sub">重设计 v1 · Preserve</div>
  <nav id="nav" aria-label="屏幕"></nav>
  <button class="reset" id="resetBtn">重置本次游历</button>
</div>

<div class="stage">
  <div class="phone">
    <div class="status">9:41</div>
    <div class="navbar" id="navbar"></div>
    <div class="viewport" id="viewport"></div>
  </div>
</div>

<div class="tweaks" id="tweaks">
  <div class="panel" id="tweaksPanel"></div>
  <button class="tbtn" id="tweaksBtn" aria-expanded="false">Tweaks</button>
</div>

<script src="v1-data.js"></script>
<script src="v1-app.js"></script>
</body>
</html>
